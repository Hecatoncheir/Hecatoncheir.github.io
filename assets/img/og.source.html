<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:wght@400;700&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #08090c;
    color: #f2f3f7;
    font-family: 'Nunito', sans-serif;
    position: relative;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  canvas { position: absolute; inset: 0; width: 1200px; height: 630px; }
  .card { position: relative; z-index: 2; padding: 74px 80px; height: 100%;
          display: flex; flex-direction: column; justify-content: space-between; }

  .badge { display: inline-flex; align-items: center; gap: 12px; align-self: flex-start;
           padding: 9px 20px 9px 14px; border: 1px solid #2b2f3c; border-radius: 999px;
           font-family: 'Anonymous Pro', monospace; font-size: 17px; letter-spacing: .12em;
           text-transform: uppercase; color: #a9adbb; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #00e9f0;
         box-shadow: 0 0 12px 2px rgba(0,233,240,.55); }

  h1 { font-weight: 800; font-size: 116px; line-height: .92; letter-spacing: -.035em;
       text-transform: uppercase; }
  /* fit-content so the gradient box hugs the word — on a full-width block the
     visible half of the sweep stops around violet and never reaches magenta */
  h1 .g { display: block; width: fit-content;
          background: linear-gradient(90deg,#00e9f0,#4d7cff,#a855f7,#ff2e93);
          -webkit-background-clip: text; background-clip: text; color: transparent; }

  .role { margin-top: 22px; font-weight: 700; font-size: 34px; letter-spacing: -.01em;
          text-transform: uppercase; color: #a9adbb; }
  .role .s { color: #ff2e93; margin: 0 12px; }

  .foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; }
  .stack { display: flex; flex-wrap: wrap; gap: 10px; }
  .stack span { padding: 8px 16px; border-radius: 8px; background: #14161d;
                font-family: 'Anonymous Pro', monospace; font-size: 19px; color: #a9adbb; }
  .url { font-family: 'Anonymous Pro', monospace; font-size: 22px; font-weight: 700;
         color: #f2f3f7; white-space: nowrap; }
</style>
</head>
<body>
<canvas id="w" width="1200" height="630"></canvas>

<div class="card">
  <div>
    <div class="badge"><span class="dot"></span>Open to interesting work</div>
    <h1 style="margin-top:38px">Vitaliy<span class="g">Vostrikov</span></h1>
    <p class="role">Full-stack developer<span class="s">/</span>&amp; designer</p>
  </div>

  <div class="foot">
    <div class="stack">
      <span>Flutter</span><span>Dart</span><span>Go</span><span>Rust</span>
      <span>gRPC</span><span>PostgreSQL</span>
    </div>
    <div class="url">hecatoncheir.github.io</div>
  </div>
</div>

<script>
/* the site's particle field, drawn once as a still frame */
(() => {
  const cv = document.getElementById('w');
  const ctx = cv.getContext('2d');
  const w = 1200, h = 630, ROWS = 26, GAP = 6, TAU = Math.PI * 2;
  const cols = Math.ceil(w / GAP) + 1;

  const g = ctx.createLinearGradient(0, 0, w, 0);
  g.addColorStop(0.00, '#00e9f0');
  g.addColorStop(0.34, '#4d7cff');
  g.addColorStop(0.68, '#a855f7');
  g.addColorStop(1.00, '#ff2e93');
  ctx.fillStyle = g;

  /* the field hugs the lower third, the way it does under the contact section */
  const midY = h * 0.80, spread = h * 0.10, amp = h * 0.16, t = 2.1;

  for (let r = 0; r < ROWS; r++) {
    const k = r / (ROWS - 1);
    const rowY = midY - spread / 2 + spread * k;
    const depth = Math.sin(Math.PI * k);
    ctx.globalAlpha = 0.14 + 0.42 * depth;
    ctx.beginPath();
    for (let c = 0; c < cols; c++) {
      const bx = c * GAP, nx = bx / w;
      const y = rowY
        + Math.sin(nx * 3.4 + t * 0.62 + k * 2.6) * amp
        + Math.sin(nx * 6.8 - t * 0.44 + k * 3.4) * amp * 0.26;
      const rad = 0.5 + depth * 0.62;
      ctx.moveTo(bx + rad, y);
      ctx.arc(bx, y, rad, 0, TAU);
    }
    ctx.fill();
  }
  ctx.globalAlpha = 1;
})();
</script>
</body>
</html>
